name: Quality
on: [push, pull_request]

jobs:
    quality:
        name: Quality
        runs-on: codebuild-stellaraf-actions-public-${{ github.run_id }}-${{ github.run_attempt }}
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v4

            - name: Node Setup
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: PNPM Setup
              uses: pnpm/action-setup@v4
              with:
                  version: "9.15.9"
                  run_install: true

            - name: Formatting
              run: pnpm run format

            - name: Lint
              run: pnpm run lint

            - name: Typing
              run: pnpm run typecheck
